<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Okul Zil Paneli</title>
<link rel="stylesheet" href="panel.css">
<script>
  // Tema, sayfa çizilmeden önce uygulanır (yanıp sönme olmasın)
  try {
    var t = localStorage.getItem('zilTheme') || 'auto';
    var dark = t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  } catch (e) {}
</script>
</head>
<body>
  <!-- Giriş -->
  <section id="login" class="login hidden">
    <form id="loginForm" class="login-card">
      <div class="login-mark" aria-hidden="true"></div>
      <h1>Okul Zil Paneli</h1>
      <p class="muted">Devam etmek için PIN girin.</p>
      <label for="pinInput" class="sr-only">PIN</label>
      <input id="pinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="PIN" required>
      <button class="btn primary block" type="submit">Giriş yap</button>
      <p id="loginErr" class="err" role="alert"></p>
    </form>
  </section>

  <!-- Uygulama -->
  <div id="app" class="app hidden">
    <aside class="side">
      <div class="brand">
        <img id="brandLogo" class="brand-logo hidden" alt="">
        <div>
          <div id="brandName" class="brand-name"></div>
          <div id="brandStatus" class="status-pill"><span class="dot"></span><span class="txt">Bağlanıyor…</span></div>
        </div>
      </div>
      <nav id="nav" class="nav" aria-label="Bölümler"></nav>
      <div class="side-foot">
        <button id="themeBtn" class="icon-btn" type="button"></button>
      </div>
    </aside>

    <header class="topbar">
      <img id="topLogo" class="brand-logo sm hidden" alt="">
      <div class="top-title">
        <div id="topName" class="brand-name"></div>
        <div id="topStatus" class="status-pill"><span class="dot"></span><span class="txt">Bağlanıyor…</span></div>
      </div>
      <button id="themeBtn2" class="icon-btn" type="button"></button>
    </header>

    <main class="main">
      <div id="banner"></div>
      <div id="page"></div>
    </main>

    <nav id="tabbar" class="tabbar" aria-label="Bölümler"></nav>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="layer"></div>

  <script src="js/core.js"></script>
  <script src="js/home.js"></script>
  <script src="js/bell.js"></script>
  <script src="js/ceremonies.js"></script>
  <script src="js/board.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/wizard.js"></script>
  <script src="js/start.js"></script>
</body>
</html>
