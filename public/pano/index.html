<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Koridor Panosu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="pano.css">
</head>
<body data-theme="dark">
<div id="stage">

  <!-- DÜZEN 1: KLASİK -->
  <section id="scr-classic" class="screen info active">
    <header class="top">
      <div class="brand"><img class="logo js-logo hide" alt=""><div class="school js-school"></div></div>
      <div class="date js-date"></div>
    </header>
    <div class="band"><img class="logo js-logo hide" alt=""><div class="band-text js-band-text"></div><div class="band-right"><div class="band-left js-band-left"></div><div class="band-sub js-band-sub"></div></div></div>
    <div class="grid2">
      <div class="col">
        <div class="card clock-card">
          <div class="clock js-clock">--:--</div>
          <div class="sub js-period"></div>
        </div>
        <div class="count-card js-count-card">
          <div><div class="count-title js-count-title"></div><div class="count-sub js-count-sub"></div></div>
          <div class="count-value js-count-value"></div>
        </div>
        <div class="chips">
          <div class="chip">Bugünkü program: <b class="js-prog"></b></div>
          <div class="chip">Son ders bitişi: <b class="js-last"></b></div>
        </div>
      </div>
      <div class="col">
        <div class="card">
          <div class="label">DUYURULAR</div>
          <div class="ann-main js-ann-main"></div>
          <div class="ann-next js-ann-next"></div>
        </div>
        <div class="grid2 inner js-extras">
          <div class="card js-duty-card"><div class="label">NÖBETÇİLER</div><div class="list js-duty"></div></div>
          <div class="card js-menu-card"><div class="label">GÜNÜN MENÜSÜ</div><div class="list js-menu"></div></div>
        </div>
      </div>
    </div>
    <footer class="ticker"><div class="ticker-tag">DUYURU</div><div class="ticker-track"><span class="js-ticker"></span></div></footer>
  </section>

  <!-- DÜZEN 2: MEDYA + BİLGİ -->
  <section id="scr-media" class="screen info">
    <header class="top">
      <div class="brand"><img class="logo js-logo hide" alt=""><div class="school js-school"></div></div>
      <div class="date js-date"></div>
    </header>
    <div class="band"><img class="logo js-logo hide" alt=""><div class="band-text js-band-text"></div><div class="band-right"><div class="band-left js-band-left"></div><div class="band-sub js-band-sub"></div></div></div>
    <div class="m-grid">
      <div class="m-left">
        <div class="media-box"><div class="media-empty">Medya eklenmedi</div></div>
        <div class="m-strip js-extras">
          <div class="strip js-duty-card"><span class="label">NÖBETÇİ</span><span class="js-duty-line"></span></div>
          <div class="strip js-menu-card"><span class="label">MENÜ</span><span class="js-menu-line"></span></div>
        </div>
      </div>
      <div class="m-right">
        <div class="card clock-card small">
          <div class="clock js-clock">--:--</div>
          <div class="sub js-period"></div>
        </div>
        <div class="count-card small js-count-card">
          <div><div class="count-title js-count-title"></div><div class="count-sub js-count-sub"></div></div>
          <div class="count-value js-count-value"></div>
        </div>
        <div class="card grow">
          <div class="label">DUYURULAR</div>
          <div class="ann-main js-ann-main"></div>
          <div class="ann-next js-ann-next"></div>
        </div>
      </div>
    </div>
    <footer class="ticker"><div class="ticker-tag">DUYURU</div><div class="ticker-track"><span class="js-ticker"></span></div></footer>
  </section>

  <!-- DÜZEN 3: TAM EKRAN MEDYA -->
  <section id="scr-fullmedia" class="screen info full">
    <div class="media-box"><div class="media-empty">Medya eklenmedi</div></div>
    <div class="f-bar">
      <div class="f-clock"><img class="logo small js-logo hide" alt=""><div class="clock js-clock">--:--</div><div class="sub js-period"></div></div>
      <div class="f-ann"><div class="label">DUYURU</div><div class="js-ann-main"></div></div>
      <div class="f-status"><span class="band-text js-band-text"></span><span class="js-band-sub"></span></div>
      <div class="f-count js-count-card"><div class="count-title js-count-title"></div><div class="count-value js-count-value"></div></div>
    </div>
  </section>

  <!-- İSTİKLAL MARŞI -->
  <section id="scr-anthem" class="screen anthem">
    <svg id="anthemFlag" class="flag" viewBox="0 0 360 360" aria-hidden="true">
      <circle cx="150" cy="180" r="120" fill="#fff"/>
      <circle cx="180" cy="180" r="96" fill="var(--anthem-bg, #C8102E)"/>
      <polygon fill="#fff" points="300,180 259.4,193.2 259.4,235.9 234.3,201.4 193.7,214.6 218.8,180 193.7,145.4 234.3,158.6 259.4,124.1 259.4,166.8"/>
    </svg>
    <img id="anthemImg" class="anthem-img hide" alt="">
    <div class="anthem-text">
      <div id="anthemKicker" class="kicker"></div>
      <h1 id="anthemTitle"></h1>
      <div id="anthemSource" class="anthem-sub"></div>
      <div id="anthemBarWrap">
        <div class="bar"><div id="anthemBar"></div></div>
        <div class="bar-meta"><span id="anthemState"></span><span id="anthemTime"></span></div>
      </div>
    </div>
  </section>

  <!-- SAYGI DURUŞU -->
  <section id="scr-saygi" class="screen saygi">
    <div id="portrait" class="portrait">
      <img id="portraitImg" alt="">
    </div>
    <div class="saygi-text">
      <div id="saygiKicker" class="kicker"></div>
      <h1 id="saygiTitle">Saygı Duruşu</h1>
      <p id="saygiLine"></p>
      <div id="saygiSteps" class="steps"></div>
    </div>
  </section>

  <!-- ACİL DURUM -->
  <section id="scr-alarm" class="screen alarm">
    <div class="alarm-head">
      <div id="alarmTitle" class="alarm-title"></div>
      <div class="alarm-meta"><div id="alarmMode"></div><div id="alarmTime"></div></div>
    </div>
    <div id="alarmBody" class="alarm-body"></div>
    <div class="alarm-foot"><div id="alarmFoot"></div><div id="alarmArea" class="area"></div></div>
  </section>

  <!-- ANONS / BİLDİRİM -->
  <div id="overlay" class="overlay"><div id="overlayText"></div></div>
</div>

<div id="audioGate" class="audio-gate">Sesi açmak için ekrana bir kez tıklayın</div>
<script src="pano.js"></script>
</body>
</html>
